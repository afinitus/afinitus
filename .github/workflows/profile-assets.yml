name: profile assets

# Daily refresh of the auto-generated profile images:
#   snake-dark.svg / snake-light.svg   contribution grid eaten by a snake (Platane/snk, framed as a card)
#   stats-dark.svg / stats-light.svg   "detector readout" stats card (scripts/profile_stats.py)
# They are published to the `output` branch as ONE orphan commit that is force-pushed every run,
# so bot commits never touch main and the branch never grows. The README embeds them from
#   https://raw.githubusercontent.com/<owner>/<repo>/output/<file>

on:
  schedule:
    - cron: "37 4 * * *" # daily 04:37 UTC; odd minute to stay clear of the top-of-hour cron rush
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write # push the output branch; nothing else is needed

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the publish step authenticates explicitly

      # Raw snake SVGs; profile_stats.py frames them to match the stats card. Colors are the
      # design tokens: empty cell, then 4 greens chosen for contrast with it, violet snake.
      - name: Contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0 (pinned: profile_stats.py frames its output)
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/raw/snake-dark.svg?color_snake=#a78bfa&color_dots=#161b22,#196c2e,#238636,#2ea043,#3fb950
            dist/raw/snake-light.svg?color_snake=#7c3aed&color_dots=#ebedf0,#4ac26b,#2da44e,#1a7f37,#116329

      # Standard library only (no pip). The user defaults to $GITHUB_REPOSITORY_OWNER.
      # Notebook bytes are mostly embedded outputs/images and would swamp the language bar;
      # OpenBot is a standalone copy of CopilotKit/OpenBot, not original code.
      - name: Stats card
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/profile_stats.py
          --out dist
          --snake-dir dist/raw
          --exclude-lang "Jupyter Notebook"
          --exclude-repo OpenBot

      - name: Publish to the output branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf dist/raw
          cd dist
          # never replace good assets with a partial set
          for f in stats-dark.svg stats-light.svg snake-dark.svg snake-light.svg; do
            test -s "$f" || { echo "::error::$f was not generated"; exit 1; }
          done
          printf '%s\n' "Generated by .github/workflows/profile-assets.yml on main." \
            "Force-pushed as a single orphan commit on every run: do not edit this branch." > README.md
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "profile assets $(date -u +%F)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
          git log --stat --format='pushed %h to output: %s'

      # GitHub disables scheduled workflows in a public repo after 60 days without repository
      # activity. Automated keepalives (dummy commits, or re-enabling the workflow through the API
      # the way gautamkrishnar/keepalive-workflow did) count as circumventing that policy: GitHub
      # disabled the keepalive-workflow repo for a ToS violation in 2025. So there is deliberately
      # no keepalive here. Instead, scheduled runs fail on days 50-52 after the last commit on main
      # (after publishing, so the images still update). A failed scheduled run notifies whoever last
      # edited the cron line, which is the nudge to push any real change. If the schedule was
      # already disabled: Actions tab -> "profile assets" -> Enable workflow (or commit an edit to the cron line).
      - name: Inactivity reminder
        if: github.event_name == 'schedule'
        run: |
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "last commit on main: ${days} days ago"
          if [ "$days" -ge 50 ] && [ "$days" -le 52 ]; then
            echo "::error::No commits on main for ${days} days. GitHub pauses this daily refresh at 60 days without activity: push any change to keep it running."
            exit 1
          elif [ "$days" -ge 45 ]; then
            echo "::warning::No commits on main for ${days} days (the schedule is paused at 60)."
          fi
